name: keep-warm

# Mantém a API do Render acordada, evitando o cold start da primeira
# requisição do dia. Pinga o healthcheck a cada 10 min (o spin-down do
# Render acontece após ~15 min de ociosidade, então há margem).
#
# Configuração necessária (uma vez):
#   Settings > Secrets and variables > Actions > New repository secret
#     Name:  API_HEALTH_URL
#     Value: https://lumen-erp-lix1.onrender.com/api/v1/health
#
# Observações:
#   - O cron do GitHub Actions não é pontual (pode atrasar sob carga); para
#     keep-warm com margem de 15 min costuma bastar.
#   - workflow_dispatch permite disparar manualmente para testar.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping para acordar a API
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "::error::Secret API_HEALTH_URL não configurado."
            exit 1
          fi
          # O objetivo é só ACORDAR o container: qualquer resposta HTTP (mesmo
          # 404) já prova que ele está de pé. Por isso NÃO usamos -f (que
          # falharia em 4xx/5xx) — falhamos apenas se não houver resposta
          # (timeout/conexão recusada), com algumas retentativas para o cold
          # start, que pode levar ~20-30s na primeira chamada do dia.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-connrefused --retry-delay 10 --max-time 90 \
            "$API_HEALTH_URL")
          echo "API respondeu HTTP $code — acordada."
